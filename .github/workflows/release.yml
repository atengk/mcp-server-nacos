name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    name: 自动发版与产物挂载
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # 打包构建插槽与计算安全校验和 (SHA-256) - 对齐 oss-template 标准
      # ------------------------------------------------------------------------
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 发版前置静态类型检查
        run: pnpm run typecheck

      - name: 发版前置全量自动化测试
        run: pnpm test

      - name: 编译构建
        run: pnpm run build

      - name: 打包发版产物并生成 SHA-256 安全校验清单
        run: |
          mkdir -p release-assets
          # 1. 归档独立产物包
          tar -czf release-assets/mcp-server-nacos-${{ github.ref_name }}-bundle.tar.gz README.md LICENSE package.json dist/ || \
          tar -czf release-assets/mcp-server-nacos-${{ github.ref_name }}-bundle.tar.gz README.md LICENSE package.json
          # 2. 打包 npm pack 标准离线包
          pnpm pack --pack-destination release-assets
          # 3. 自动为目录下所有文件生成 SHA-256 校验清单（排除 checksums 自身，防自污染报错）
          cd release-assets && sha256sum $(ls -1 | grep -v '^checksums\.txt$') > checksums.txt

      - name: 生成发布日志 (基于 Commit 与 PR)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: 创建 GitHub Release 并挂载发布内容与校验清单
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.tgz
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: 发布至 npm 官方仓库
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: 安装依赖与编译构建
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run build

      - name: 发布至 npm 官方仓库
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: 构建并推送 Docker 镜像 (GHCR)
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器 (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: 构建并推送多架构镜像 (amd64 / arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
